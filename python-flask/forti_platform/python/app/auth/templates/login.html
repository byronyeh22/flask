<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forti Platform Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='font/bootstrap-icons.css') }}" rel="stylesheet">
  <style>
    html, body { height: 100%; background: #f8f9fb; }
    body {
      font-family: 'Segoe UI', 'Noto Sans TC', 'Arial', sans-serif;
      color: #23272b; margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-container { width: 100vw; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fb; }
    .login-card {
      background-color: #fff; border-radius: 1.1rem;
      box-shadow: 0 4px 30px 0 #10192b0f, 0 1.5px 6px 0 #b6d0ef11;
      padding: 2.5rem 2.2rem 2.2rem 2.2rem; max-width: 420px; width: 100%;
      border: 1px solid #e8e9ef; margin: auto;
    }
    .login-logo { font-size: 2rem; font-weight: 600; color: #299cff; letter-spacing: 0.5px; margin-bottom: 0.2em; text-align: center; user-select: none; }
    .login-title { font-size: 1.3rem; text-align: center; color: #299cff; font-weight: 700; margin-bottom: 1.1rem; letter-spacing: 1px; }
    .form-label { font-weight: 600; color: #0b3048; }
    .form-control { background: #f3f6fb; color: #222b37; border-radius: 0.5rem; border: 1px solid #b6c6e1; font-size: 1.05rem; margin-bottom: 1.1rem; box-shadow: none; }
    .form-control:focus { border-color: #299cff; box-shadow: 0 0 0 0.1rem #e8f1ff; background: #eaf3ff; }
    .form-control::placeholder { color: #90a2bc; opacity: 1; }
    .btn-primary { background-color: #299cff; border: none; font-weight: 600; border-radius: 0.75rem; letter-spacing: 0.5px; box-shadow: 0 1.5px 10px #5fb1fd2b; font-size: 1.08rem; padding-top: 0.7em; padding-bottom: 0.7em; }
    .btn-primary:hover, .btn-primary:focus { background-color: #1676c4; border: none; }
    .btn-success { border-radius: 0.75rem; font-weight: 600; font-size: 1.08rem; padding-top: 0.7em; padding-bottom: 0.7em; }
    .alert-info { background-color: #e8f3ff; color: #1676c4; border: 1.5px solid #bbe5ff; font-weight: 500; border-radius: 0.75rem; margin-bottom: 1.1rem; font-size: 1.04rem; text-align: center; }
    .alert-danger { background-color: #fff0f0; color: #b02d2d; border: 1.5px solid #eeb1b3; font-weight: 500; border-radius: 0.75rem; margin-bottom: 1.1rem; font-size: 1.04rem; text-align: center; }
    .fade-out { opacity: 0 !important; transition: opacity 0.5s; }
    .login-foot { margin-top: 1.3rem; text-align: center; color: #97a4b5; font-size: 0.97em; letter-spacing: 0.06em; }
    @media (max-width: 450px) { .login-card { padding: 1.3rem 0.8rem 1.1rem 0.8rem; } .login-logo { font-size: 1.55rem; } .login-title { font-size: 1.04rem; } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card shadow-sm">
      <div class="login-logo mb-1">FORTI PLATFORM</div>
      <div class="login-title mb-3">Sign In</div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <!-- Tabs -->
      <ul class="nav nav-pills nav-fill mb-3" id="loginModeTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="local-tab" data-bs-toggle="tab" data-bs-target="#local-pane" type="button" role="tab" aria-controls="local-pane" aria-selected="false">
            Local Login
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="ad-tab" data-bs-toggle="tab" data-bs-target="#ad-pane" type="button" role="tab" aria-controls="ad-pane" aria-selected="true">
            Active Directory
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Local Login -->
        <div class="tab-pane fade" id="local-pane" role="tabpanel" aria-labelledby="local-tab" tabindex="0">
          <form method="post" autocomplete="off" class="mt-2">
            <input type="hidden" name="auth_mode" value="local">
            <div class="mb-2">
              <label class="form-label" for="login-username">Username</label>
              <input type="text" name="username" id="login-username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="login-password">Password</label>
              <input type="password" name="password" id="login-password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">
              <i class="bi bi-person-circle me-2"></i>Sign In (Local)
            </button>
          </form>
        </div>

        <!-- AD Login -->
        <div class="tab-pane fade show active" id="ad-pane" role="tabpanel" aria-labelledby="ad-tab" tabindex="0">
          <form method="post" autocomplete="off" class="mt-2">
            <input type="hidden" name="auth_mode" value="ad">
            <div class="mb-2">
              <label class="form-label" for="ad-username">AD Account (email or sAMAccountName)</label>
              <input type="text" name="username" id="ad-username" class="form-control" placeholder="e.g., jdoe or jdoe@sanbox888.tw" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="ad-password">Password</label>
              <input type="password" name="password" id="ad-password" class="form-control" placeholder="Enter your AD password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-2">
              <i class="bi bi-shield-lock me-2"></i>Sign In (AD)
            </button>
          </form>
        </div>
      </div>

      <div class="login-foot">© Forti Platform</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Auto fade-out alerts
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.alert').forEach(alert => {
        setTimeout(() => {
          alert.classList.add('fade-out');
          setTimeout(() => alert.remove(), 600);
        }, 2600);
      });
    });
  </script>
</body>
</html>
