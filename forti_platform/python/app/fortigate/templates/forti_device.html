{% extends "base.html" %}
{% block title %}Forti · Devices{% endblock %}

{% block content %}
<style>
  /* VDOM chips */
  #vdomChips .badge{
    font-weight:500; padding:.45rem .6rem; display:inline-flex; align-items:center;
  }
  #vdomChips .badge .btn-close{ transform: scale(.8); margin-left:.35rem; }
  #tblDevices tbody tr{ cursor:pointer; }
  .dev-id-link{ color:#0d6efd; text-decoration:underline; cursor:pointer; }
  .status-dot{ display:inline-block; width:.55rem; height:.55rem; border-radius:50%; margin-right:.35rem; }
  .dot-on{ background:#28a745; } .dot-off{ background:#6c757d; }
  .dot-ssl{ background:#0dcaf0; }
</style>

<div class="container py-3">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <h3 class="mb-0">FortiGate Devices</h3>
    <div class="input-group" style="max-width:320px;">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input id="searchBox" class="form-control" placeholder="Search name or host">
    </div>
  </div>

  <div class="row g-3">
    <!-- Devices List -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center py-2">
          <strong>Devices</strong>
          <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddDevice">
            <i class="bi bi-plus-circle"></i> Add
          </button>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0" id="tblDevices">
            <thead class="table-light">
              <tr>
                <th style="width:80px;">ID</th>
                <th>Name</th>
                <th>Host</th>
                <th style="width:90px;">Port</th>
                <th style="width:120px;">Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div class="p-2 small text-muted" id="devEmpty">No devices.</div>
        </div>
      </div>
    </div>

    <!-- VDOM Management -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header py-2"><strong>VDOMs</strong></div>
        <div class="card-body">
          <div class="mb-2">
            <span class="me-2">Device:</span>
            <span id="selDevice" class="fw-bold">—</span>
          </div>

          <div class="mb-2">
            <div id="vdomChips" class="d-flex flex-wrap gap-2"></div>
          </div>

          <div class="input-group mb-2">
            <input id="vdomInput" class="form-control" placeholder="Add a VDOM and press Enter">
            <button id="btnAddVdom" class="btn btn-outline-secondary" type="button">Add</button>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-primary" type="button" id="btnSaveVdoms" disabled>
              <i class="bi bi-save"></i> Save VDOMs
            </button>
            <span id="vdomMsg" class="small text-muted"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
  <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Forti</strong>
      <small class="text-muted">now</small>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body" id="toastBody">Done</div>
  </div>
</div>

<!-- Modal: Add Device -->
<div class="modal fade" id="modalAddDevice" tabindex="-1" aria-labelledby="modalAddDeviceLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="addDeviceForm">
      <div class="modal-header">
        <h5 class="modal-title" id="modalAddDeviceLabel">Add Device</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Host</label>
          <input type="text" class="form-control" name="host" placeholder="172.26.x.x" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Port</label>
          <input type="number" class="form-control" name="port" value="443">
        </div>
        <div class="mb-2">
          <label class="form-label">API Token</label>
          <input type="password" class="form-control" name="api_token" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Verify SSL</label>
          <select class="form-select" name="verify_ssl">
            <option value="1" selected>Yes</option>
            <option value="0">No</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Active</label>
          <select class="form-select" name="is_active">
            <option value="1" selected>Active</option>
            <option value="0">Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Edit/Delete Device -->
<div class="modal fade" id="modalEditDevice" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="editDeviceForm" data-id="">
      <div class="modal-header">
        <h5 class="modal-title">Edit Device</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="col-8">
            <label class="form-label">Host</label>
            <div class="input-group">
              <input type="text" class="form-control" name="host" required>
              <button class="btn btn-outline-secondary" type="button" id="btnCopyHost" title="Copy host"><i class="bi bi-clipboard"></i></button>
            </div>
          </div>
          <div class="col-4">
            <label class="form-label">Port</label>
            <input type="number" class="form-control" name="port" value="443">
          </div>

          <div class="col-12">
            <label class="form-label">API Token <span class="text-muted small">(留白則不變)</span></label>
            <input type="password" class="form-control" name="api_token" placeholder="(unchanged if empty)">
          </div>

          <div class="col-6">
            <label class="form-label">Verify SSL</label>
            <select class="form-select" name="verify_ssl">
              <option value="1">Yes</option>
              <option value="0">No</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Active</label>
            <select class="form-select" name="is_active">
              <option value="1">Active</option>
              <option value="0">Inactive</option>
            </select>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="button" class="btn btn-outline-primary" id="btnProbe"><i class="bi bi-activity"></i> Probe</button>
          <span id="probeMsg" class="small text-muted"></span>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-danger" id="btnDeleteDevice">
          <i class="bi bi-trash"></i> Delete
        </button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
function showToast(msg){
  document.getElementById('toastBody').textContent = msg;
  const t = new bootstrap.Toast(document.getElementById('liveToast'));
  t.show();
}
async function fetchJSON(url, opts={}) {
  const res = await fetch(url, { headers: { "Content-Type":"application/json" }, ...opts });
  const data = await res.json().catch(()=>({}));
  if (!res.ok || data.ok === false) {
    const err = data.error || res.statusText;
    showToast(`Error: ${err}`);
    throw new Error(err);
  }
  return data;
}

/* 安全與回退：通用複製函式 */
async function copyTextToClipboard(text){
  if (!text) return false;

  // 現代 API（需 https 或 localhost）
  if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      // fall through
    }
  }
  // Fallback：隱藏 textarea + execCommand
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    const ok = document.execCommand('copy');
    return !!ok;
  }catch(e){
    return false;
  }finally{
    document.body.removeChild(ta);
  }
}

const tbody = document.querySelector('#tblDevices tbody');
const devEmpty = document.getElementById('devEmpty');
const selDevice = document.getElementById('selDevice');
const vdomChips = document.getElementById('vdomChips');
const vdomInput = document.getElementById('vdomInput');
const btnAddVdom = document.getElementById('btnAddVdom');
const btnSaveVdoms = document.getElementById('btnSaveVdoms');
const vdomMsg = document.getElementById('vdomMsg');
const searchBox = document.getElementById('searchBox');

let currentDeviceId = null;
let currentDeviceLabel = '';
let vdomList = [];
let devicesRaw = []; // 原始資料
const devicesCache = new Map();

/* ---------- Device table ---------- */
function badge(html){ return `<span class="badge rounded-pill bg-secondary">${html}</span>`; }
function renderRow(it){
  const active = Number(it.is_active) === 1;
  const ssl = Number(it.verify_ssl) === 1;
  const idHtml = `<span class="dev-id-link" data-id="${it.id}">${it.id}</span>`;
  const status = `
    <span class="status-dot ${active ? 'dot-on' : 'dot-off'}"></span>${active ? 'Active' : 'Inactive'}
    ${ssl ? badge('<span class="status-dot dot-ssl"></span>SSL') : ''}
  `;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${idHtml}</td>
    <td>${it.name}</td>
    <td>${it.host}</td>
    <td>${it.port}</td>
    <td>${status}</td>
  `;

  // 整列點擊 → 載入 VDOMs
  tr.addEventListener('click', () => loadVdoms(it.id, `${it.name} (${it.host})`));

  // ID 點擊 → 攔截，開編輯 modal
  tr.querySelector('.dev-id-link').addEventListener('click', (e) => {
    e.stopPropagation();
    openEditDeviceModal(it);
  });
  return tr;
}

function applyFilter(){
  const q = (searchBox.value || '').trim().toLowerCase();
  const items = q ? devicesRaw.filter(d => (d.name||'').toLowerCase().includes(q) || (d.host||'').toLowerCase().includes(q)) : devicesRaw.slice();
  tbody.innerHTML = '';
  if(!items.length){ devEmpty.style.display=''; return; }
  devEmpty.style.display='none';
  items.forEach(it => {
    devicesCache.set(Number(it.id), it);
    tbody.appendChild(renderRow(it));
  });
}

async function loadDevices(){
  const data = await fetchJSON('/fortigate/device/devices');
  devicesRaw = (data.items || []).slice();
  applyFilter();
}
searchBox.addEventListener('input', applyFilter);

/* ---------- Edit/Delete modal ---------- */
const editForm = document.getElementById('editDeviceForm');
const btnDeleteDevice = document.getElementById('btnDeleteDevice');
const btnProbe = document.getElementById('btnProbe');
const probeMsg = document.getElementById('probeMsg');
const btnCopyHost = document.getElementById('btnCopyHost');

function fillEditForm(dev){
  editForm.dataset.id = dev.id;
  editForm.name.value = dev.name || '';
  editForm.host.value = dev.host || '';
  editForm.port.value = dev.port || 443;
  editForm.verify_ssl.value = String(dev.verify_ssl ? 1 : 0);
  editForm.is_active.value = String(dev.is_active ? 1 : 0);
  editForm.api_token.value = ''; // 留白則不變
}
function openEditDeviceModal(dev){
  fillEditForm(dev);
  probeMsg.textContent = '';
  const m = new bootstrap.Modal(document.getElementById('modalEditDevice'));
  m.show();
}

// Save (PUT)
editForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = editForm.dataset.id;
  const body = {
    name: editForm.name.value.trim(),
    host: editForm.host.value.trim(),
    port: parseInt(editForm.port.value || 443, 10),
    verify_ssl: parseInt(editForm.verify_ssl.value, 10),
    is_active: parseInt(editForm.is_active.value, 10),
  };
  if (editForm.api_token.value.trim()){
    body.api_token = editForm.api_token.value.trim();
  }
  try{
    await fetchJSON(`/fortigate/device/devices/${id}`, { method:'PUT', body: JSON.stringify(body) });
    bootstrap.Modal.getInstance(document.getElementById('modalEditDevice')).hide();
    showToast('Updated.');
    await loadDevices();
    const dev = devicesCache.get(Number(id));
    if (Number(currentDeviceId) === Number(id) && dev){
      currentDeviceLabel = `${dev.name} (${dev.host})`;
      selDevice.textContent = currentDeviceLabel;
    }
  }catch(_){}
});

// Delete (DELETE)
btnDeleteDevice.addEventListener('click', async ()=>{
  const id = editForm.dataset.id;
  if (!id) return;
  if (!confirm(`Delete device #${id}? This cannot be undone.`)) return;
  try{
    await fetchJSON(`/fortigate/device/devices/${id}`, { method:'DELETE' });
    bootstrap.Modal.getInstance(document.getElementById('modalEditDevice')).hide();
    if (Number(currentDeviceId) === Number(id)) {
      currentDeviceId = null; currentDeviceLabel = ''; vdomList = [];
      selDevice.textContent = '—';
      renderVdomChips(); btnSaveVdoms.disabled = true; vdomMsg.textContent = '';
    }
    showToast('Deleted.');
    await loadDevices();
  }catch(_){}
});

// Probe
btnProbe.addEventListener('click', async ()=>{
  const id = editForm.dataset.id;
  probeMsg.textContent = 'Probing...';
  try{
    const r = await fetchJSON(`/fortigate/device/devices/${id}/probe`);
    probeMsg.textContent = r.ok ? `OK ${r.latency_ms ?? '-'} ms (${r.endpoint || ''})` : 'Failed';
  }catch(e){
    probeMsg.textContent = 'Failed';
  }
});

// Copy host (含 clipboard fallback)
btnCopyHost.addEventListener('click', async ()=>{
  const host = editForm.host.value.trim();
  if(!host) return;
  const ok = await copyTextToClipboard(host);
  showToast(ok ? 'Host copied' : 'Copy failed (browser blocked)');
});

/* ---------- VDOMs ---------- */
function renderVdomChips(){
  vdomChips.innerHTML = '';
  if (!vdomList.length){
    vdomChips.innerHTML = '<span class="text-muted">No VDOMs.</span>';
    return;
  }
  vdomList.forEach(v=>{
    const span = document.createElement('span');
    span.className = 'badge rounded-pill bg-secondary';
    span.innerHTML = `${v}<button type="button" class="btn-close btn-close-white" aria-label="Remove" data-remove="${v}"></button>`;
    vdomChips.appendChild(span);
  });
}
function addVdom(v){
  v = String(v||'').trim();
  if(!v) return;
  if (!vdomList.includes(v)) {
    vdomList.push(v);
    vdomList.sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base'}));
    renderVdomChips();
  }
}
function removeVdom(v){
  vdomList = vdomList.filter(x => x !== v);
  renderVdomChips();
}
vdomChips.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-remove]');
  if (!btn) return;
  removeVdom(btn.getAttribute('data-remove'));
});
btnAddVdom.addEventListener('click', ()=>{
  addVdom(vdomInput.value);
  vdomInput.value = '';
  vdomInput.focus();
});
vdomInput.addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){
    e.preventDefault();
    addVdom(vdomInput.value);
    vdomInput.value = '';
  }
});
async function loadVdoms(id, label){
  currentDeviceId = id;
  currentDeviceLabel = label;
  selDevice.textContent = label;
  vdomMsg.textContent = 'Loading...';
  btnSaveVdoms.disabled = true;
  try{
    const data = await fetchJSON(`/fortigate/device/devices/${id}/vdoms`);
    vdomList = (data.vdoms || []).slice();
    renderVdomChips();
    vdomMsg.textContent = '';
    btnSaveVdoms.disabled = false;
  }catch(err){
    vdomList = [];
    renderVdomChips();
    vdomMsg.textContent = err.message;
  }
}
btnSaveVdoms.addEventListener('click', async ()=>{
  if(!currentDeviceId) return;
  vdomMsg.textContent = 'Saving...';
  try{
    await fetchJSON(`/fortigate/device/devices/${currentDeviceId}/vdoms`, {
      method: 'POST',
      body: JSON.stringify({ vdoms: vdomList })
    });
    vdomMsg.textContent = 'Saved.';
    showToast('VDOMs saved.');
  }catch(err){
    vdomMsg.textContent = `Failed: ${err.message}`;
  }
});

/* ---------- Add device ---------- */
document.getElementById('addDeviceForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = 'Saving...';

  const data = Object.fromEntries(new FormData(form).entries());
  data.port = parseInt(data.port || 443, 10);
  data.is_active = parseInt(data.is_active, 10);
  data.verify_ssl = parseInt(data.verify_ssl, 10);

  try{
    await fetchJSON('/fortigate/device/devices', { method:'POST', body: JSON.stringify(data) });
    form.reset();
    bootstrap.Modal.getInstance(document.getElementById('modalAddDevice')).hide();
    showToast('Device added.');
    await loadDevices();
  }catch(_){
    // fetchJSON 已顯示錯誤 toast
  }finally{
    btn.disabled = false;
    btn.innerHTML = original;
  }
});
/* ---------- boot ---------- */
loadDevices();
</script>
{% endblock %}
